[project]
name = "multi_pov"
version = "0.2.0"
description = "Default template for PDM package"
authors = [{ name = "hemakodaa", email = "hemakodaa@gmail.com" }]
dependencies = ["youtube-transcript-api>=1.0.3", "notable-moments @ file:///${PROJECT_ROOT}/../notable_moments/dist/notable_moments-0.2.3-py3-none-any.whl"]
requires-python = ">=3.13, <3.14"
readme = "README.md"
license = { text = "MIT" }


[tool.pdm]
distribution = false

[tool.pdm.scripts]
main = "python src/multi_pov/main.py"
